<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>File Browser</title>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <form id="search">
        <input type="search" name="q" placeholder="Search this folder" />
        <button type="submit">Search</button>
        <a id="clear-search" href="#/" hidden>Clear</a>
    </form>
    <form id="upload">
        <input type="file" name="file" required />
        <button type="submit">Upload</button>
        <output name="status"></output>
    </form>
    <main id="listing"></main>
</body>
</html>
